name: Build AyuGram iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build IPA
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout AyuGram patches
        uses: actions/checkout@v4
        with:
          path: ayu-patches

      - name: Clone Telegram-iOS
        run: |
          git clone --recurse-submodules --depth=1 \
            https://github.com/TelegramMessenger/Telegram-iOS.git \
            telegram-ios

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('telegram-ios/WORKSPACE') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Apply AyuGram patches
        run: |
          cp -r ayu-patches/AyuGram telegram-ios/Telegram/Telegram-iOS/
          python3 ayu-patches/apply_patches.py telegram-ios

      - name: Setup build configuration
        run: |
          cd telegram-ios
          cat > build-configuration.json << 'EOF'
          {
            "bundleId": "org.ayugram.telegram",
            "developmentTeam": "AYUGRAMTEAM1",
            "baseAppBundleId": "org.ayugram.telegram",
            "appGroupId": "group.org.ayugram.telegram",
            "keychainGroup": "org.ayugram.telegram",
            "appStoreId": "686449807",
            "provisioningProfileSpecifier_main": "",
            "provisioningProfileSpecifier_widget": "",
            "provisioningProfileSpecifier_notificationservice": "",
            "provisioningProfileSpecifier_intents": "",
            "provisioningProfileSpecifier_intentsui": "",
            "provisioningProfileSpecifier_watch": "",
            "provisioningProfileSpecifier_watchwidget": "",
            "provisioningProfileSpecifier_notificationcontent": "",
            "provisioningProfileSpecifier_share": ""
          }
          EOF
          cat build-configuration.json

      - name: Generate Xcode project
        run: |
          cd telegram-ios
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-configuration.json \
            --xcodeManagedCodesigning

      - name: Build Telegram.app
        run: |
          cd telegram-ios
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-configuration.json \
            --xcodeManagedCodesigning

      - name: Package IPA
        run: |
          APP_PATH=$(find . -name "Telegram.app" -type d 2>/dev/null | head -1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/Telegram.app
          rm -rf Payload/Telegram.app/_CodeSignature || true
          zip -r AyuGram-unsigned.ipa Payload
          echo "IPA size: $(du -sh AyuGram-unsigned.ipa)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-unsigned-${{ github.run_number }}
          path: AyuGram-unsigned.ipa
          retention-days: 7
